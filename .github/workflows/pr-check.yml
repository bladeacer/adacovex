name: PR compliance gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  complexity-gate:
    name: Complexity gate (no god objects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce complexity + file-size caps
        run: make complexity-check

  coverage-delta:
    name: Docstring coverage delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          target: .
          standard: all
          gnat-version: 15.2.1
          build: true
          coverage-delta: ${{ github.event.pull_request.base.sha }}

  summary:
    name: PR summary
    if: always()
    needs: [complexity-gate, coverage-delta]
    runs-on: ubuntu-latest
    steps:
      - name: Write PR summary
        shell: bash
        env:
          CX: ${{ needs.complexity-gate.result }}
          DELTA: ${{ needs.coverage-delta.result }}
        run: |
          set -euo pipefail
          {
            echo '## PR compliance gate summary'
            echo ''
            echo '| Job | Result |'
            echo '|-----|--------|'
            echo "| Complexity gate (no god objects) | $CX |"
            echo "| Docstring coverage delta vs base | $DELTA |"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CX" = "failure" ] || [ "$DELTA" = "failure" ]; then
            echo '**FAILED: complexity and/or docstring coverage regressed.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$DELTA" = "failure" ]; then
            echo "::error::Docstring coverage regressed against the PR base branch." >&2
          fi
          echo 'Compliance gates passed.' >> "$GITHUB_STEP_SUMMARY"
