name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-assessment:
    name: Self-assessment (all standards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Swap in the development manifest (pinned gnatprove)
        #  The self-assessment proves THIS tree, and gnatprove is a
        #  dev-only dependency: it lives in alire-dev.toml so the
        #  published covex crate stays zero-dependency.  Without the
        #  swap `alr build` provisions nothing for the prover, and the
        #  prove step fetches a toolchain instead of using the
        #  dependency the manifest pins -- the same swap `just doc`,
        #  `just fmt`, and `just prove` perform locally through
        #  tools/dev-cmd.py.  This job only assesses this tree, so the
        #  dev manifest stays in place for its duration; the release
        #  workflow builds the publishing alire.toml unchanged.
        shell: bash
        run: |
          set -euxo pipefail
          cp -f alire-dev.toml alire.toml
      - uses: ./
        with:
          target: .
          standard: all
          gnat-version: 16.1.0
          build: true
          prove: true
          #  Quiet (benign-info suppression) is the default; CI passes
          #  --verbose so its output stays authoritative.
          verbose: true
          require-spark: Platinum
          require-docstrings: 100
          require-tests: 1818
          require-proof: 100
          #  Statement-coverage gate: the action runs
          #  `spark-coverage --require-coverage=... --gate-metric=statements`
          #  after the assessment.  It fails when the proved share of
          #  the statements in the bodies gnatprove analysed is below
          #  this floor (adacovex spark-coverage --metric=statements).
          require-coverage: 55
          gate-metric: statements

  adacovex-tests:
    name: Build + native tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          target: .
          dal: C
          gnat-version: 16.1.0
          build: true
          run-tests: true
          assess: false

  #  The macOS/Windows build matrix used to live here as `platform-build`.
  #  It now runs in release.yml only: the cross-platform build check is a
  #  release gate, so an ordinary push or pull request does not pay for the
  #  two extra runners.  Linux coverage stays with the action jobs above,
  #  and docs/usage/platforms.md points at the release workflow for the
  #  non-Linux rows.
  no-spark-off:
    name: SPARK_Mode Off gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce no SPARK_Mode (Off) outside Types.Implementation
        #  Gates run as plain Python: the runner image ships python3, and
        #  tools/tasks.py owns the same recipe `just <task>` runs locally, so
        #  CI needs neither make nor just.
        run: python3 tools/tasks.py spark-off-check

  complexity-gate:
    # Cyclomatic-complexity + LOC gate: fails when a function exceeds the
    # decision-point cap or a file dominates the codebase (god objects /
    # god functions / extra-long files).  See adacovex complexity --help.
    name: Complexity gate (no god objects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=16.1.0 gprbuild'
          cache: true
      - name: Enforce complexity + file-size caps
        run: python3 tools/tasks.py complexity-check

  action-parity:
    # Feature gate: the composite action must mirror the base CLI option set
    # (and the docs/usage/ci-cd.md input table) 1:1.  Fails when a CLI flag, action
    # input, or docs row drifts out of sync.
    name: Action/CLI/docs parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce action/CLI/docs parity
        run: python3 tools/tasks.py action-parity-check

  docs-coverage:
    # Feature gate: the user documentation must cover the base CLI option set,
    # the served route set, and every hand-written usage/contributing page
    # (each named by a {toctree}).  Fails when a flag, route, or page is
    # missing from the docs.
    name: Documentation coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce documentation coverage
        run: python3 tools/tasks.py docs-coverage-check

  version-consistency:
    # Feature gate: the two manifests, the generated Ada version spec, the
    # built binary, and the committed sbom.json must all name the same
    # version.  The release task used to prove the tree before it built the
    # release binary, so the proof pass and every artifact it wrote came
    # from the previous release's binary.  This is the tree-wide backstop.
    name: Version consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce one version across every source
        run: |
          python3 tools/gen-version.py --check
          python3 tools/tasks.py version-consistency-check

  consumer-run-tests:
    timeout-minutes: 15
    # Regression test for the action's run-tests in a CONSUMER workspace:
    # build:true builds adacovex in a scratch checkout, so the action must
    # build the target's native tests itself before running test-command
    # (this is what broke Ada_CRDT's release workflow -- ./test_crdt was
    # never built).  The workspace root is restructured into a minimal
    # zero-dependency fixture (no adacovex.gpr) so the consumer branch of
    # the action triggers, then `uses: ./` runs the action against it.
    name: Action run-tests (consumer workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restructure workspace into a consumer fixture
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/adacovex-src"
          mkdir -p "$SRC"
          shopt -s dotglob
          mv "$GITHUB_WORKSPACE"/* "$SRC/" 2>/dev/null || true
          shopt -u dotglob
          # The fixture is the workspace root: a tiny Alire crate whose
          # `alr build` produces ./fixture_main (Exec_Dir ".").
          cp "$SRC/action.yml" "$GITHUB_WORKSPACE/action.yml"
          mkdir -p src obj
          cat > alire.toml <<'FIXTURE'
          name = "fixture"
          description = "adacovex action consumer fixture"
          version = "0.1.0"
          authors = ["adacovex"]
          maintainers = ["adacovex <noreply@example.com>"]
          maintainers-logins = ["adacovex"]
          licenses = "MIT"
          executables = ["fixture_main"]
          FIXTURE
          cat > fixture.gpr <<'FIXTURE'
          project fixture is
             for Languages use ("Ada");
             for Source_Dirs use ("src");
             for Object_Dir use "obj";
             for Exec_Dir use ".";
             for Main use ("fixture_main.adb");
          end fixture;
          FIXTURE
          cat > src/fixture_main.adb <<'FIXTURE'
          with Ada.Text_IO;
          procedure Fixture_Main is
          begin
             Ada.Text_IO.Put_Line ("fixture tests passed");
          end Fixture_Main;
          FIXTURE
      - uses: ./
        with:
          target: .
          dal: C
          gnat-version: 16.1.0
          build: true
          run-tests: true
          test-command: ./fixture_main
          assess: false

  coverage-gate:
    name: Docstring coverage gate (release tags)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=16.1.0 gprbuild'
          cache: true
      - name: Run coverage gate
        shell: bash
        run: python3 tools/tasks.py coverage-gate

  summary:
    name: CI summary
    if: always()
    needs: [self-assessment, adacovex-tests, no-spark-off, complexity-gate, action-parity, docs-coverage, version-consistency, consumer-run-tests, coverage-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Write CI summary
        shell: bash
        env:
          SELF: ${{ needs.self-assessment.result }}
          TESTS: ${{ needs.adacovex-tests.result }}
          OFFOFF: ${{ needs.no-spark-off.result }}
          COMPLEX: ${{ needs.complexity-gate.result }}
          PARITY: ${{ needs.action-parity.result }}
          DOCS: ${{ needs.docs-coverage.result }}
          VERSION: ${{ needs.version-consistency.result }}
          CONSUMER: ${{ needs.consumer-run-tests.result }}
          GATE: ${{ needs.coverage-gate.result }}
        run: |
          set -euo pipefail
          FAILED=0
          {
            echo '## CI summary'
            echo ''
            echo '| Job | Result |'
            echo '|-----|--------|'
            echo "| Self-assessment (all standards) | $SELF |"
            echo "| Build + native tests | $TESTS |"
            echo "| SPARK_Mode Off gate | $OFFOFF |"
            echo "| Complexity gate (no god objects) | $COMPLEX |"
            echo "| Action/CLI/docs parity gate | $PARITY |"
            echo "| Documentation coverage gate | $DOCS |"
            echo "| Version consistency gate | $VERSION |"
            echo "| Action run-tests (consumer workspace) | $CONSUMER |"
            echo "| Coverage gate (push only) | $GATE |"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          for R in "$SELF" "$TESTS" "$OFFOFF" "$COMPLEX" "$PARITY" "$DOCS" "$VERSION" "$CONSUMER" "$GATE"; do
            if [ "$R" = "failure" ]; then
              FAILED=1
              echo "::error::A CI job failed -- see the failing job logs and its adacovex assessment summary." >&2
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo '**CI FAILED: one or more jobs did not pass.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'All CI jobs passed.' >> "$GITHUB_STEP_SUMMARY"
