name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-assessment:
    name: Self-assessment (DAL-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/adacovex
        with:
          target: .
          dal: C
          gnat-version: 15.2.0

  adacovex-tests:
    name: Build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Alire toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ALR_VER=2.1.1
          ALR_TGZ="alr-$ALR_VER-bin-x86_64-linux.tar.gz"
          curl -fsSL "https://github.com/alire-project/alire/releases/download/v$ALR_VER/$ALR_TGZ" \
            -o "$RUNNER_TEMP/$ALR_TGZ"
          tar -xzf "$RUNNER_TEMP/$ALR_TGZ" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          cp "$RUNNER_TEMP/bin/alr" "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          alr toolchain --select gnat_native=15.2.0 gprbuild --disable-assistant
      - name: Build and test
        shell: bash
        run: |
          set -euxo pipefail
          alr build
          ./bin/test_runner
