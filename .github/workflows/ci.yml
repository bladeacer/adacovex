name: CI

#  The everyday gate: pull requests and pushes to main run the cheap code
#  quality gates, the build + native suite, and the self-assessment.  The
#  expensive surfaces live where they belong:
#
#    version-bump.yml  the macOS/Windows native suite, on the push that
#                      bumps the version (once per release, not per commit)
#    release.yml       the CLI/prove/Playwright e2e suites, the cross-
#                      platform build matrix, and the publish pipeline, on
#                      a release tag whose commit main carries
#
#  The scenario table in ci-scenario.md records which job runs when.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    #  Every gate here is pure Python and needs no compiler, so the whole
    #  set runs in one job: one runner, one checkout, and a failure names the
    #  gate in its step log.  A gate whose host tool is missing SKIPs with its
    #  reason (tools/taskkit/gates.py), exactly as `just check` does locally.
    name: Code quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Static gates
        shell: bash
        run: |
          set -euo pipefail
          for gate in \
            ascii-check \
            csslint-check \
            spark-off-check \
            changelog-check \
            action-parity-check \
            docs-coverage-check \
            diagnostics-coverage-check \
            test-layout-check \
            portability-check \
            surface-parity-check \
            docs-tree-check \
            link-check \
            docs-check \
            para-split-check \
            tldr-check \
            tools-check \
            version-source-check \
            version-consistency-check
          do
            echo "=== $gate ==="
            python3 tools/tasks.py "$gate"
          done
      - name: Regenerated files in sync
        shell: bash
        run: |
          set -euo pipefail
          CHECK=1 python3 tools/tasks.py description
          CHECK=1 python3 tools/tasks.py requirements

  build-test:
    name: Build + native tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=16.1.0 gprbuild'
          cache: true
      - name: Build and run the native suite
        shell: bash
        run: python3 tools/tasks.py test
      - name: Complexity gate (no god objects)
        shell: bash
        run: python3 tools/tasks.py complexity-check

  self-assessment:
    name: Self-assessment (all standards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Swap in the development manifest (pinned gnatprove)
        #  The self-assessment proves THIS tree, and gnatprove is a
        #  dev-only dependency: it lives in alire-dev.toml so the
        #  published covex crate stays zero-dependency.  Without the
        #  swap `alr build` provisions nothing for the prover, and the
        #  prove step fetches a toolkit instead of using the
        #  dependency the manifest pins -- the same swap `just doc`,
        #  `just fmt`, and `just prove` perform locally through
        #  tools/dev-cmd.py.  This job only assesses this tree, so the
        #  dev manifest stays in place for its duration; the release
        #  workflow builds the publishing alire.toml unchanged.
        shell: bash
        run: |
          set -euxo pipefail
          cp -f alire-dev.toml alire.toml
      - name: Compute the proof-input hash
        #  Cache key for the gnatprove session store below.  It covers the
        #  proof-relevant sources only: the two generated bundle specs
        #  (adacovex-docs_template.ads, adacovex-dashboard_template.ads)
        #  are data-only string constants with no proof surface, so a docs
        #  or dashboard edit must not invalidate a cached session -- the
        #  same exclusion the prove result cache's input hash uses
        #  (Is_Proof_Input in adacovex-prove.adb).  The hand-written
        #  adacovex-docs_template.adb body stays in: it is real code and a
        #  genuine proof input.
        id: proof-hash
        shell: bash
        run: |
          set -euxo pipefail
          HASH=$(git ls-files -z '*.ads' '*.adb' '*.gpr' \
            | grep -zv 'adacovex-docs_template\.ads\|adacovex-dashboard_template\.ads' \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 \
            || echo "${{ github.run_id }}")
          # Collapse any newline/space-separated multi-value output back into
          # one line (for example a multi-line value from a consumer-runner
          # fallback on an unmanaged target).  GITHUB_OUTPUT wants one value
          # per line.
          echo "hash=$(echo "$HASH" | tr -d '\n ')" >> "$GITHUB_OUTPUT"
      - name: Restore the gnatprove session store
        #  obj/gnatprove/ is gnatprove's incremental session store.  A hit
        #  skips re-proving the units whose inputs are unchanged, so the
        #  self-assessment pays the full solver cost only when proof-
        #  relevant sources actually changed.  The key is content-addressed
        #  on the sources above, so a stale restore cannot mask a regression.
        uses: actions/cache@v4
        with:
          path: obj/gnatprove
          key: gnatprove-session-${{ runner.os }}-${{ steps.proof-hash.outputs.hash }}
      - uses: ./
        with:
          target: .
          standard: all
          gnat-version: 16.1.0
          build: true
          prove: true
          #  Both caches are safe by construction.  `cache` persists the
          #  Alire toolchain; `result-cache` persists adacovex's on-disk
          #  result cache, whose entries are keyed by SHA-256 content
          #  hashes, so a restored entry is either an exact hit for the
          #  inputs or absent -- it can never mask a regression.  The
          #  prove result cache additionally refuses to serve a stored
          #  summary whose Total row reports unproved VCs, so a degraded
          #  run (e.g. one killed mid-session) is re-proved, not replayed.
          cache: true
          result-cache: true
          #  Quiet (benign-info suppression) is the default; CI passes
          #  --verbose so its output stays authoritative.
          verbose: true
          require-spark: Gold
          require-docstrings: 100
          require-tests: 2494
          require-proof: 100
          #  Statement-coverage gate: the action runs
          #  `spark-coverage --require-coverage=... --gate-metric=statements`
          #  after the assessment.  It fails when the proved share of
          #  the statements in the bodies gnatprove analysed is below
          #  this floor (adacovex spark-coverage --metric=statements).
          require-coverage: 55
          gate-metric: statements

  coverage-delta:
    #  Pull-request regression gate: the docstring-coverage delta against the
    #  PR base branch.  It used to live in pr-check.yml; one workflow now owns
    #  both event types, so a PR runs nothing twice.
    name: Docstring coverage delta (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          target: .
          standard: all
          gnat-version: 16.1.0
          build: true
          coverage-delta: ${{ github.event.pull_request.base.sha }}
          #  Toolkit + adacovex result cache.  Result-cache entries are
          #  keyed by SHA-256 content hashes, so a restore is either an
          #  exact hit or absent and can never mask a regression.
          cache: true
          result-cache: true

  summary:
    name: CI summary
    if: always()
    needs: [quality, build-test, self-assessment, coverage-delta]
    runs-on: ubuntu-latest
    steps:
      - name: Write CI summary
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build-test.result }}
          SELF: ${{ needs.self-assessment.result }}
          DELTA: ${{ needs.coverage-delta.result }}
        run: |
          set -euo pipefail
          FAILED=0
          {
            echo '## CI summary'
            echo ''
            echo '| Job | Result |'
            echo '|-----|--------|'
            echo "| Code quality gates | $QUALITY |"
            echo "| Build + native tests | $BUILD |"
            echo "| Self-assessment (all standards) | $SELF |"
            echo "| Docstring coverage delta (pull requests) | $DELTA |"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          for R in "$QUALITY" "$BUILD" "$SELF" "$DELTA"; do
            if [ "$R" = "failure" ]; then
              FAILED=1
              echo "::error::A CI job failed -- see the failing job logs and its adacovex assessment summary." >&2
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo '**CI FAILED: one or more jobs did not pass.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'All CI jobs passed.' >> "$GITHUB_STEP_SUMMARY"
