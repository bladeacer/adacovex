name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-assessment:
    name: Self-assessment (DAL-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/adacovex
        with:
          target: .
          dal: C
          gnat-version: 15.2.1

  adacovex-tests:
    name: Build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Alire toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ALR_VER=2.1.1
          ALR_ZIP="alr-$ALR_VER-bin-x86_64-linux.zip"
          curl -fsSL "https://github.com/alire-project/alire/releases/download/v$ALR_VER/$ALR_ZIP" \
            -o "$RUNNER_TEMP/$ALR_ZIP"
          unzip -q "$RUNNER_TEMP/$ALR_ZIP" -d "$RUNNER_TEMP/alr-$ALR_VER"
          mkdir -p "$HOME/.local/bin"
          cp "$RUNNER_TEMP/alr-$ALR_VER/bin/alr" "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          alr toolchain --select gnat_native=15.2.1 gprbuild --disable-assistant
      - name: Build and test
        shell: bash
        run: |
          set -euxo pipefail
          alr build
          ./bin/test_runner
