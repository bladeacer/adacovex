name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-assessment:
    name: Self-assessment (all standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          target: .
          standard: all
          gnat-version: 15.2.1
          build: true
          prove: true
          require-spark: Platinum
          require-docstrings: 100
          require-tests: 501
          require-proof: 100

  adacovex-tests:
    name: Build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          run-tests: true
          assess: false

  coverage-gate:
    name: Docstring coverage gate (release tags)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=15.2.1 gprbuild'
          cache: true
      - name: Run coverage gate
        shell: bash
        run: make coverage-gate
