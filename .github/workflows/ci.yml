name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-assessment:
    name: Self-assessment (DAL-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          prove: true
          gnatprove-version: 16.1.0
          require-spark: Platinum
          require-docstrings: 100
          require-tests: 360
          require-proof: 100

  adacovex-tests:
    name: Build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          run-tests: true
          assess: false
