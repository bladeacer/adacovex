name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-assessment:
    name: Self-assessment (DAL-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/adacovex
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          prove: true

  adacovex-tests:
    name: Build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/adacovex
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          run-tests: true
          assess: false
