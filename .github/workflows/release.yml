name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/adacovex
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          release-build: true
          prove: true

      - name: Package release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp bin/adacovex dist/adacovex
          ln -s adacovex dist/covex
          tar -czf "adacovex-$VERSION.tar.gz" -C dist .
          tar -czf "adacovex-action-$VERSION.tar.gz" -C . .github/actions/adacovex

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "adacovex-${{ github.ref_name }}.tar.gz" \
            "adacovex-action-${{ github.ref_name }}.tar.gz" \
            --generate-notes

      - name: Update floating version tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -fa "$MAJOR" -m "Release $VERSION"
          git tag -fa "$MINOR" -m "Release $VERSION"
          git push origin "refs/tags/$MAJOR" --force
          git push origin "refs/tags/$MINOR" --force
