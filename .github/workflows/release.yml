name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce action/CLI/docs parity
        run: make action-parity-check

      - name: Enforce documentation coverage
        run: make docs-coverage-check

      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=16.1.0 gprbuild'
          cache: true

      - name: Enforce complexity + file-size caps
        run: make complexity-check

      - uses: ./
        id: adacovex
        with:
          target: .
          standard: all
          gnat-version: 16.1.0
          build: true
          release-build: true
          prove: true
          #  Quiet (benign-info suppression) is the default; CI passes
          #  --verbose so its output stays authoritative.
          verbose: true
          require-spark: Platinum
          require-docstrings: 100
          require-tests: 1775
          require-proof: 100

      - name: Require Platinum SPARK level
        shell: bash
        run: |
          set -euo pipefail
          LEVEL="${{ steps.adacovex.outputs.spark-level }}"
          if [ "$LEVEL" != "Platinum" ]; then
            echo "::error::release gate requires SPARK Platinum, got: $LEVEL"
            exit 1
          fi
          echo "SPARK level: $LEVEL (release gate passed)"

      - name: Package release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp bin/adacovex dist/adacovex
          ln -s adacovex dist/covex
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          cp LICENSE dist/LICENSE
          cp docs/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          tar -czf "adacovex-$VERSION.tar.gz" -C dist .
          tar -czf "adacovex-action-$VERSION.tar.gz" -C . action.yml

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: adacovex-*.tar.gz

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          CUR="${VERSION#v}"
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$VERSION$" | head -1 || true)
          PREV_NUM="${PREV#v}"
          # Every changelog from the last release tag up to this version,
          # newest first (version sort, not glob order).
          CHANGELOGS=$(for f in docs/changelogs/adacovex-*.md; do
            v="${f#docs/changelogs/adacovex-}"
            v="${v%.md}"
            if [ -n "$PREV_NUM" ]; then
              # Skip versions at or below the previous release.
              [ "$(printf '%s\n%s\n' "$v" "$PREV_NUM" | sort -V | head -1)" != "$v" ] || continue
            fi
            # Skip anything newer than this version (should not happen).
            [ "$(printf '%s\n%s\n' "$v" "$CUR" | sort -V | tail -1)" = "$CUR" ] || continue
            printf '%s\n' "$v"
          done | sort -V -r | while read -r v; do
            # The docs live on Read the Docs (the Sphinx site built from
            # docs/); each release's changelog has a stable page there.
            printf -- '- https://adacovex.readthedocs.io/en/latest/changelogs/adacovex-%s.html\n' "$v"
          done)
          BODY="**Changelogs**
          $CHANGELOGS"
          ASSETS=("adacovex-$VERSION.tar.gz" "adacovex-action-$VERSION.tar.gz")
          if [ -n "$PREV" ]; then
            BODY="$BODY

          *Git Changelog*:
          https://github.com/${{ github.repository }}/compare/$PREV...$VERSION"
          fi
          if [ -n "$ATTESTATION_URL" ]; then
            BODY="$BODY

          *Build Provenance Attestation*:
          $ATTESTATION_URL"
          fi
          #  A re-run must not die on a release this workflow already
          #  published. The floating-tag step is the last one, so any failure
          #  after this point can only be retried when the publish step is
          #  idempotent: update the notes and replace the assets instead.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists (re-run): updating notes and assets."
            gh release edit "$VERSION" --notes "$BODY"
            gh release upload "$VERSION" "${ASSETS[@]}" --clobber
          else
            gh release create "$VERSION" "${ASSETS[@]}" --notes "$BODY"
          fi

      - name: Update floating version tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          #  The floating refs are vMAJOR, vMAJOR.MINOR, and latest. The
          #  release tag itself is never rewritten (a one-component tag such
          #  as v1 collapses both names onto it), and a name already in the
          #  list is kept once (a two-component tag makes both the same).
          REFS=()
          for name in "${VERSION%%.*}" "${VERSION%.*}" latest; do
            case " ${REFS[*]:-} $VERSION " in
              *" $name "*) continue ;;
            esac
            REFS+=("$name")
          done
          for name in "${REFS[@]}"; do
            git tag -fa "$name" -m "Release $VERSION"
          done
          #  One push, retried: a transient server-side error must not turn a
          #  published release red, and git names the ref it refused.
          PUSHES=()
          for name in "${REFS[@]}"; do
            PUSHES+=("refs/tags/$name")
          done
          ok=0
          for attempt in 1 2 3; do
            if git push --force origin "${PUSHES[@]}"; then ok=1; break; fi
            echo "::warning::floating-tag push failed (attempt $attempt of 3); retrying"
            sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::cannot move ${PUSHES[*]} to $VERSION. A server-side refusal means the tag is protected (Settings > Rules > Protected tags) or belongs to an immutable release; remove that rule, then re-run this workflow."
            exit 1
          fi
          echo "Floating tags updated: ${PUSHES[*]}"

  summary:
    name: Release summary
    if: always()
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Write release summary
        shell: bash
        env:
          RELEASE: ${{ needs.release.result }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo '## Release summary'
            echo ''
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Tag | $VERSION |"
            echo "| Build + self-assessment + publish | $RELEASE |"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE" = "failure" ]; then
            echo "::error::Release job failed for $VERSION." >&2
            echo '**FAILED: release pipeline did not complete.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Release pipeline passed.' >> "$GITHUB_STEP_SUMMARY"
