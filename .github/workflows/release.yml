name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@latest
        with:
          version: '2.1.1'
          toolchain: 'gnat_native=15.2.1 gprbuild'

      - name: Run GNATprove
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f alire-dev.toml ]; then
            echo "::error::alire-dev.toml required to generate proof artifacts."
            exit 1
          fi
          cp alire.toml "$RUNNER_TEMP/alire.toml.bak"
          cp alire-dev.toml alire.toml
          alr gnatprove
          mv "$RUNNER_TEMP/alire.toml.bak" alire.toml

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail
          alr build --release

      - name: Validate self-assessment
        shell: bash
        run: |
          set -euxo pipefail
          ./bin/adacovex_main --target=. --dal=C

      - name: Package release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp bin/adacovex_main dist/adacovex_main
          ln -s adacovex_main dist/adacovex
          ln -s adacovex_main dist/covex
          tar -czf "adacovex-$VERSION.tar.gz" -C dist .
          tar -czf "adacovex-action-$VERSION.tar.gz" -C . .github/actions/adacovex

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "adacovex-${{ github.ref_name }}.tar.gz" \
            "adacovex-action-${{ github.ref_name }}.tar.gz" \
            --generate-notes
