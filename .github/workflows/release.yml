name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce action/CLI/docs parity
        run: make action-parity-check

      - name: Enforce complexity + file-size caps
        run: make complexity-check

      - uses: ./
        id: adacovex
        with:
          target: .
          standard: all
          gnat-version: 16.1.0
          build: true
          release-build: true
          prove: true
          #  Quiet (benign-info suppression) is the default; CI passes
          #  --verbose so its output stays authoritative.
          verbose: true
          require-spark: Platinum
          require-docstrings: 100
          require-tests: 973
          require-proof: 100

      - name: Require Platinum SPARK level
        shell: bash
        run: |
          set -euo pipefail
          LEVEL="${{ steps.adacovex.outputs.spark-level }}"
          if [ "$LEVEL" != "Platinum" ]; then
            echo "::error::release gate requires SPARK Platinum, got: $LEVEL"
            exit 1
          fi
          echo "SPARK level: $LEVEL (release gate passed)"

      - name: Package release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp bin/adacovex dist/adacovex
          ln -s adacovex dist/covex
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          cp LICENSE dist/LICENSE
          cp docs/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          tar -czf "adacovex-$VERSION.tar.gz" -C dist .
          tar -czf "adacovex-action-$VERSION.tar.gz" -C . action.yml

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: adacovex-*.tar.gz

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          CUR="${VERSION#v}"
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$VERSION$" | head -1 || true)
          PREV_NUM="${PREV#v}"
          # Every changelog from the last release tag up to this version,
          # newest first (version sort, not glob order).
          CHANGELOGS=$(for f in docs/changelogs/adacovex-*.md; do
            v="${f#docs/changelogs/adacovex-}"
            v="${v%.md}"
            if [ -n "$PREV_NUM" ]; then
              # Skip versions at or below the previous release.
              [ "$(printf '%s\n%s\n' "$v" "$PREV_NUM" | sort -V | head -1)" != "$v" ] || continue
            fi
            # Skip anything newer than this version (should not happen).
            [ "$(printf '%s\n%s\n' "$v" "$CUR" | sort -V | tail -1)" = "$CUR" ] || continue
            printf '%s\n' "$v"
          done | sort -V -r | while read -r v; do
            printf -- '- https://github.com/%s/blob/main/docs/changelogs/adacovex-%s.md\n' "${{ github.repository }}" "$v"
          done)
          BODY="**Changelogs**
          $CHANGELOGS"
          ASSETS=("adacovex-$VERSION.tar.gz" "adacovex-action-$VERSION.tar.gz")
          if [ -n "$PREV" ]; then
            BODY="$BODY

          *Git Changelog*:
          https://github.com/${{ github.repository }}/compare/$PREV...$VERSION"
          fi
          if [ -n "$ATTESTATION_URL" ]; then
            BODY="$BODY

          *Build Provenance Attestation*:
          $ATTESTATION_URL"
          fi
          gh release create "$VERSION" "${ASSETS[@]}" --notes "$BODY"

      - name: Update floating version tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -fa "$MAJOR" -m "Release $VERSION"
          git tag -fa "$MINOR" -m "Release $VERSION"
          git tag -fa latest -m "Release $VERSION"
          git push origin "refs/tags/$MAJOR" --force
          git push origin "refs/tags/$MINOR" --force
          git push origin "refs/tags/latest" --force

  summary:
    name: Release summary
    if: always()
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Write release summary
        shell: bash
        env:
          RELEASE: ${{ needs.release.result }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo '## Release summary'
            echo ''
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Tag | $VERSION |"
            echo "| Build + self-assessment + publish | $RELEASE |"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE" = "failure" ]; then
            echo "::error::Release job failed for $VERSION." >&2
            echo '**FAILED: release pipeline did not complete.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Release pipeline passed.' >> "$GITHUB_STEP_SUMMARY"
