name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          target: .
          dal: C
          gnat-version: 15.2.1
          build: true
          release-build: true
          prove: true

      - name: Package release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp bin/adacovex dist/adacovex
          ln -s adacovex dist/covex
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          cp LICENSE dist/LICENSE
          cp docs/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          tar -czf "adacovex-$VERSION.tar.gz" -C dist .
          tar -czf "adacovex-action-$VERSION.tar.gz" -C . action.yml

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$VERSION$" | head -1 || true)
          BODY="**Human Readable Changelogs**
          https://github.com/${{ github.repository }}/blob/main/docs/changelogs/adacovex-$VERSION.md"
          ASSETS=("adacovex-$VERSION.tar.gz" "adacovex-action-$VERSION.tar.gz")
          if [ -n "$PREV" ]; then
            BODY="$BODY

          *Git Changelog*:
          https://github.com/${{ github.repository }}/compare/${PREV#v}...$VERSION"
          fi
          # Attach a platform toolchain asset if one was built for this tag
          # (e.g. adacovex-toolchain-linux-x86_64.tar.gz). The gnatprove
          # toolchain is large and optional: `covex prove` falls back to a
          # PATH or ~/.adacovex/toolchain gnatprove otherwise.
          for f in adacovex-toolchain-*.tar.gz; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          gh release create "$VERSION" "${ASSETS[@]}" --notes "$BODY"

      - name: Update floating version tags
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION="${{ github.ref_name }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -fa "$MAJOR" -m "Release $VERSION"
          git tag -fa "$MINOR" -m "Release $VERSION"
          git tag -fa latest -m "Release $VERSION"
          git push origin "refs/tags/$MAJOR" --force
          git push origin "refs/tags/$MINOR" --force
          git push origin "refs/tags/latest" --force
