name: 'adacovex'
description: >-
  Run the adacovex Ada/SPARK verification pipeline: docstring coverage,
  GNATprove proof analysis, test-result parsing, DO-178C DAL assessment, and
  proof-aware SBOM generation. Writes a Markdown summary to
  $GITHUB_STEP_SUMMARY, uploads SVG badges, and emits a CycloneDX/SPDX SBOM.
author: 'bladeacer'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  target:
    description: 'Target project root directory (relative to workspace root).'
    required: false
    default: '.'
  dal:
    description: 'DO-178C DAL level to assess (A-E, case-insensitive).'
    required: false
    default: 'C'
  gnat-version:
    description: 'GNAT toolchain version to select via alr (e.g. 15.2.1).'
    required: false
    default: '15.2.1'
  version:
    description: >-
      adacovex version to use, e.g. 1.3.0. Defaults to the release tag this
      action was referenced by (e.g. @v1.3.0). A floating ref (@v1 or @v1.3)
      is resolved to the latest matching published release. Only used when
      build is false, to download the matching adacovex release binary.
    required: false
    default: ''
  build:
    description: >-
      Build adacovex from source (true) or download the release binary matching
      this action's version (false, default). Downloading uses the 'version'
      input or the tag this action is referenced by, so the marketplace action
      at @v1.3.0 always runs the v1.3.0 binary and @v1 runs the latest v1.x
      release. Set true for in-repo self-assessment where the workspace is
      adacovex itself.
    required: false
    default: 'false'
  prove:
    description: >-
      Run GNATprove before assessing via the adacovex `prove` subcommand
      (bundled gnatprove resolution -- PATH, ~/.adacovex/toolchain/bin, or a
      platform toolchain download -- so the target needs no alire.toml
      gnatprove dependency). Use when the target repo does not commit
      gnatprove.out but needs a proof level, e.g. adacovex's own
      self-assessment.
    required: false
    default: 'false'
  run-tests:
    description: >-
      Build and run the native test suite (requires build: true). Use for
      build/test-only jobs that do not run the assessment.
    required: false
    default: 'false'
  release-build:
    description: >-
      Pass --release to alr build. Use for release workflows that need an
      optimized binary.
    required: false
    default: 'false'
  assess:
    description: >-
      Run the adacovex assessment and publish outputs + SVG badges. Set false
      for build/test-only jobs (e.g. the test suite job).
    required: false
    default: 'true'
  compare-base:
    description: >-
      Git base ref to run a differential assessment against (e.g. origin/main).
      When set, the action runs --compare-base and fails on regression. The
      SBOM is not generated in differential mode.
    required: false
    default: ''
  coverage-delta:
    description: >-
      Git base ref to gate docstring coverage against (e.g. origin/main).
      When set, the action runs --coverage-delta and fails if coverage dropped.
      The SBOM is not generated in coverage-gate mode.
    required: false
    default: ''
  emit-markdown:
    description: 'Write VERIFICATION.md + TRACE.md into this directory (relative).'
    required: false
    default: ''
  generate-sbom:
    description: >-
      Generate a proof-aware SBOM after the assessment and upload it as an
      artifact. The SBOM is now emitted automatically at the end of every
      adacovex assessment (unless --no-sbom); this input controls that
      behavior and the artifact upload. The SBOM carries the
      adacovex:proof_level and adacovex:dal_target properties on every
      component. Set false to skip SBOM generation entirely.
    required: false
    default: 'true'
  sbom-format:
    description: >-
      SBOM format to generate: cyclonedx-json (writes <target>/sbom.json),
      spdx-json (writes <target>/sbom.spdx.json), or md (writes
      <target>/docs/compliance/SBOM.md).
    required: false
    default: 'cyclonedx-json'
  cache:
    description: 'Enable dependency/toolchain caching with actions/cache.'
    required: false
    default: 'true'

outputs:
  dal-status:
    description: 'DAL assessment status: Achieved or Unmet.'
    value: ${{ steps.adacovex.outputs.dal_status }}
  spark-level:
    description: 'SPARK assurance level detected (Stone..Platinum).'
    value: ${{ steps.adacovex.outputs.spark_level }}
  test-count:
    description: 'Number of passing tests.'
    value: ${{ steps.adacovex.outputs.test_count }}
  coverage-pct:
    description: 'Current docstring coverage percentage (--coverage-delta mode).'
    value: ${{ steps.adacovex.outputs.coverage_pct }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Alire toolchain
      if: ${{ inputs.build == 'true' || inputs.prove == 'true' }}
      uses: alire-project/setup-alire@latest
      with:
        version: '2.1.1'
        toolchain: 'gnat_native=${{ inputs.gnat-version }} gprbuild'
        cache: ${{ inputs.cache }}

    - name: Download adacovex release binary
      if: ${{ inputs.build == 'false' }}
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euxo pipefail
        VERSION="${INPUT_VERSION:-${ACTION_REF}}"
        VERSION="${VERSION#v}"
        if [ -z "$VERSION" ]; then
          echo "::error::build: false requires the 'version' input or a release-tag reference (e.g. @v1.3.0, @v1, or @latest)."
          exit 1
        fi
        # Resolve the 'latest' keyword to the newest published release.
        if [ "$VERSION" = "latest" ]; then
          echo "Resolving 'latest' to the newest published release..."
          VERSION=$(curl -fsSL "https://api.github.com/repos/${ACTION_REPO}/releases/latest" \
            | grep -oE '"tag_name": *"v[0-9]+\.[0-9]+\.[0-9]+"' \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -c2-)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve 'latest' release for ${ACTION_REPO}."
            exit 1
          fi
          echo "Resolved to v${VERSION}"
        fi
        # Resolve a floating ref (v1 or v1.3) to the latest matching release tag.
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Resolving floating ref v${VERSION} to latest matching release..."
          VERSION=$(curl -fsSL "https://api.github.com/repos/${ACTION_REPO}/releases" \
            | grep -oE '"tag_name": *"v[0-9]+\.[0-9]+\.[0-9]+"' \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -E "^v${VERSION}(\\.|$)" | head -1 | cut -c2-)
          if [ -z "$VERSION" ]; then
            echo "::error::No release found matching floating ref v${INPUT_VERSION:-${ACTION_REF}}."
            exit 1
          fi
          echo "Resolved to v${VERSION}"
        fi
        ASSET="adacovex-v${VERSION}.tar.gz"
        echo "Downloading $ASSET from ${ACTION_REPO} release v${VERSION}"
        mkdir -p "$GITHUB_WORKSPACE/bin"
        curl -fsSL "https://github.com/${ACTION_REPO}/releases/download/v${VERSION}/${ASSET}" \
          -o "$RUNNER_TEMP/${ASSET}"
        tar -xzf "$RUNNER_TEMP/${ASSET}" -C "$GITHUB_WORKSPACE/bin"
        chmod +x "$GITHUB_WORKSPACE/bin/adacovex"
        "$GITHUB_WORKSPACE/bin/adacovex" --help >/dev/null 2>&1 || true

    - name: Download gnatprove toolchain
      if: ${{ inputs.build == 'false' && inputs.prove == 'true' }}
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euxo pipefail
        case "${RUNNER_OS}" in
          Linux) OS=linux ;;
          macOS) OS=macos ;;
          Windows) OS=windows ;;
          *) echo "::error::unsupported runner OS: ${RUNNER_OS}"; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) ARCH=x86_64 ;;
          ARM64) ARCH=aarch64 ;;
          *) echo "::error::unsupported runner arch: ${RUNNER_ARCH}"; exit 1 ;;
        esac
        ASSET="adacovex-toolchain-${OS}-${ARCH}.tar.gz"
        echo "Downloading ${ASSET} into ~/.adacovex/toolchain"
        mkdir -p "$HOME/.adacovex/toolchain"
        curl -fsSL "https://github.com/${ACTION_REPO}/releases/latest/download/${ASSET}" \
          -o "$RUNNER_TEMP/${ASSET}"
        tar -xzf "$RUNNER_TEMP/${ASSET}" -C "$HOME/.adacovex/toolchain"
        ls "$HOME/.adacovex/toolchain/bin/gnatprove"

    - name: Build adacovex
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        if [ "${{ inputs.release-build }}" == 'true' ]; then
          alr build --release
        else
          alr build
        fi

    - name: Run native tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        ./bin/test_runner

    - name: Run GNATprove
      if: ${{ inputs.prove == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        if [ -x bin/adacovex ]; then
          ./bin/adacovex prove --target="${{ inputs.target }}"
        elif command -v adacovex >/dev/null 2>&1; then
          adacovex prove --target="${{ inputs.target }}"
        elif command -v covex >/dev/null 2>&1; then
          covex prove --target="${{ inputs.target }}"
        else
          echo "::error::adacovex binary not found. Set build: true or install adacovex on PATH."
          exit 1
        fi

    - name: Run adacovex assessment
      if: ${{ inputs.assess == 'true' }}
      id: adacovex
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        BIN=""
        if [ -x bin/adacovex ]; then
          BIN="$GITHUB_WORKSPACE/bin/adacovex"
        elif command -v adacovex >/dev/null 2>&1; then
          BIN="$(command -v adacovex)"
        elif command -v covex >/dev/null 2>&1; then
          BIN="$(command -v covex)"
        fi
        if [ -z "$BIN" ]; then
          echo "::error::adacovex binary not found. Set build: true or install adacovex on PATH."
          exit 1
        fi
        ARGS=()
        ARGS+=(--target="${{ inputs.target }}")
        ARGS+=(--dal=${{ inputs.dal }})
        if [ -n "${{ inputs.compare-base }}" ]; then
          ARGS+=(--compare-base="${{ inputs.compare-base }}")
        fi
        if [ -n "${{ inputs.coverage-delta }}" ]; then
          ARGS+=(--coverage-delta="${{ inputs.coverage-delta }}")
        fi
        if [ -n "${{ inputs.emit-markdown }}" ]; then
          ARGS+=(--emit-markdown="${{ inputs.emit-markdown }}")
        fi
        if [ "${{ inputs.generate-sbom }}" == 'false' ]; then
          ARGS+=(--no-sbom)
        elif [ -z "${{ inputs.compare-base }}" ] && [ -z "${{ inputs.coverage-delta }}" ]; then
          ARGS+=(--sbom-format=${{ inputs.sbom-format }})
        fi
        set +e
        "$BIN" "${ARGS[@]}" > "$RUNNER_TEMP/adacovex.out" 2>&1
        STATUS=$?
        set -e
        cat "$RUNNER_TEMP/adacovex.out"

        DAL_STATUS=$(grep -oE 'DAL-[A-E]:.*(Achieved|Unmet)' "$RUNNER_TEMP/adacovex.out" | grep -oE '(Achieved|Unmet)' | head -1 || true)
        SPARK_LEVEL=$(grep -oE '(Stone|Bronze|Silver|Gold|Platinum)' "$RUNNER_TEMP/adacovex.out" | head -1 || true)
        TEST_COUNT=$(grep -oE '[0-9]+ passed' "$RUNNER_TEMP/adacovex.out" | grep -oE '[0-9]+' | head -1 || true)
        # Prefer the machine-parseable coverage_delta line (--coverage-delta mode);
        # otherwise fall back to the "docstrings:  N/ M ( P%)" line in normal mode.
        COVERAGE_PCT=$(grep -oE 'coverage_delta:.*current= *[0-9]+' "$RUNNER_TEMP/adacovex.out" | grep -oE '[0-9]+$' | head -1 || true)
        if [ -z "$COVERAGE_PCT" ]; then
          COVERAGE_PCT=$(grep -oE '\( *[0-9]+%\)' "$RUNNER_TEMP/adacovex.out" | grep -oE '[0-9]+' | head -1 || true)
        fi

        echo "dal_status=${DAL_STATUS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "spark_level=${SPARK_LEVEL:-unknown}" >> "$GITHUB_OUTPUT"
        echo "test_count=${TEST_COUNT:-0}" >> "$GITHUB_OUTPUT"
        echo "coverage_pct=${COVERAGE_PCT:-0}" >> "$GITHUB_OUTPUT"

        {
          echo '## adacovex assessment'
          echo ''
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| Target | \`${{ inputs.target }}\` |"
          echo "| DAL-${{ inputs.dal }} | ${DAL_STATUS:-unknown} |"
          echo "| SPARK level | ${SPARK_LEVEL:-unknown} |"
          echo "| Tests passed | ${TEST_COUNT:-0} |"
          echo "| Coverage | ${COVERAGE_PCT:-0}% |"
          echo ''
          echo '```text'
          cat "$RUNNER_TEMP/adacovex.out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit $STATUS

    - name: Upload badges
      if: ${{ always() && inputs.assess == 'true' && inputs.compare-base == '' && inputs.coverage-delta == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: adacovex-badges
        path: ${{ inputs.target }}/docs/badges/*.svg
        if-no-files-found: ignore

    - name: Upload SBOM
      if: ${{ always() && inputs.assess == 'true' && inputs.generate-sbom == 'true' && inputs.compare-base == '' && inputs.coverage-delta == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: adacovex-sbom
        path: |
          ${{ inputs.target }}/sbom*.json
          ${{ inputs.target }}/docs/compliance/SBOM.md
        if-no-files-found: ignore
