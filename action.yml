name: 'adacovex'
description: >-
  Ada/SPARK coverage, proof, DO-178C DAL assessment and proof-aware SBOM
  generation.
author: 'bladeacer'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  target:
    description: 'Target project root directory (relative to workspace root).'
    required: false
    default: '.'
  dal:
    description: 'DO-178C DAL level to assess (A-E, case-insensitive).'
    required: false
    default: 'C'
  standard:
    description: >-
      Compliance standard to assess: do178c, iso26262, iec62304, or all
      (emits badges/reports for every standard at the shared tier).
    required: false
    default: ''
  asil:
    description: >-
      ISO 26262 ASIL level to assess (A-D or QM, case-insensitive).  Sets
      both the standard (ISO 26262) and the shared rigor tier.
    required: false
    default: ''
  class:
    description: >-
      IEC 62304 software safety class to assess (A-C, case-insensitive).
      Sets both the standard (IEC 62304) and the shared rigor tier.
    required: false
    default: ''
  gnat-version:
    description: 'GNAT toolchain version to select via alr (e.g. 15.2.1).'
    required: false
    default: '15.2.1'
  version:
    description: >-
      adacovex version; defaults to the release tag this action is
      referenced by.
    required: false
    default: ''
  build:
    description: >-
      Build adacovex from source (true) or download the release binary
      (false).  Consumers of this action normally use false (the default);
      true builds adacovex from source, cloning the repository at the
      referenced ref when the workspace is not adacovex itself.
    required: false
    default: 'false'
  prove:
    description: >-
      Run GNATprove before assessing via the adacovex prove subcommand.
    required: false
    default: 'false'
  require-spark:
    description: >-
      Minimum SPARK level (Stone/Bronze/Silver/Gold/Platinum) the assessment
      must reach, otherwise the step fails loudly.  CI threshold gate.
    required: false
    default: ''
  require-docstrings:
    description: >-
      Minimum docstring coverage percentage (0-100) the assessment must reach,
      otherwise the step fails loudly.  CI threshold gate.
    required: false
    default: ''
  require-tests:
    description: >-
      Minimum number of passing tests required, otherwise the step fails
      loudly.  CI threshold gate.
    required: false
    default: ''
  require-proof:
    description: >-
      Minimum proved-VC coverage percentage (0-100) required, otherwise the
      step fails loudly.  CI threshold gate.
    required: false
    default: ''
  run-tests:
    description: 'Build and run the native test suite (requires build: true).'
    required: false
    default: 'false'
  test-command:
    description: >-
      Command (relative to the workspace root) used to run the target's test
      suite when run-tests is true.  Defaults to the adacovex self-test runner.
    required: false
    default: './bin/test_runner'
  release-build:
    description: 'Pass --release to alr build for an optimized binary.'
    required: false
    default: 'false'
  assess:
    description: 'Run the adacovex assessment and publish outputs + SVG badges.'
    required: false
    default: 'true'
  compare-base:
    description: 'Git base ref to run a differential assessment against.'
    required: false
    default: ''
  coverage-delta:
    description: 'Git base ref to gate docstring coverage against.'
    required: false
    default: ''
  emit-markdown:
    description: 'Write VERIFICATION.md + TRACE.md into this directory (relative).'
    required: false
    default: ''
  generate-sbom:
    description: 'Generate a proof-aware SBOM after the assessment and upload it.'
    required: false
    default: 'true'
  sbom-format:
    description: 'SBOM format: cyclonedx-json, spdx-json, or md.'
    required: false
    default: 'cyclonedx-json'
  cache:
    description: 'Enable dependency/toolchain caching with actions/cache.'
    required: false
    default: 'true'
  result-cache:
    description: >-
      Persist adacovex's on-disk result cache (~/.adacovex/cache) across
      workflow runs with actions/cache. Entries are keyed by SHA-256 content
      hashes, so restoring a stale cache is always safe: only artifacts that
      are byte-for-byte unchanged since the previous run are served from it.
    required: false
    default: 'true'
  manifest:
    description: 'Override the target project manifest path (relative to workspace root).'
    required: false
    default: ''
  no-svg:
    description: 'Suppress SVG badge generation.'
    required: false
    default: 'false'
  relaxed:
    description: 'Disable strict mode (skip dirs, no patches); strict is the default.'
    required: false
    default: 'false'
  skip-dir:
    description: 'Directory name to skip in relaxed mode (repeatable; comma-separated).'
    required: false
    default: ''
  verbose:
    description: 'Verbose diagnostics on stderr.'
    required: false
    default: 'false'
  no-cache:
    description: 'Disable adacovex on-disk result caching (always re-scan/re-prove).'
    required: false
    default: 'false'
  cache-dir:
    description: 'Override adacovex result cache directory (default ~/.adacovex/cache).'
    required: false
    default: ''
  cache-max:
    description: 'Max adacovex result-cache entries before oldest-first eviction.'
    required: false
    default: ''
  prove-jobs:
    description: 'GNATprove parallelism for the prove subcommand (-j, default auto-detect).'
    required: false
    default: ''
  prove-level:
    description: 'GNATprove proof effort 0-4 for the prove subcommand.'
    required: false
    default: ''
  prove-timeout:
    description: 'GNATprove per-check prover timeout in seconds.'
    required: false
    default: ''
  prove-steps:
    description: 'GNATprove max proof steps (reproducible).'
    required: false
    default: ''
  prove-memlimit:
    description: 'GNATprove prover memory limit in MB.'
    required: false
    default: ''
  prove-force:
    description: 'Force full GNATprove reanalysis (-f).'
    required: false
    default: 'false'
  prove-no-loop-unrolling:
    description: 'Disable GNATprove automatic loop unrolling.'
    required: false
    default: 'false'
  prove-no-inlining:
    description: 'Disable GNATprove contextual-analysis inlining.'
    required: false
    default: 'false'

outputs:
  dal-status:
    description: 'DAL assessment status: Achieved or Unmet.'
    value: ${{ steps.adacovex.outputs.dal_status }}
  spark-level:
    description: 'SPARK assurance level detected (Stone..Platinum).'
    value: ${{ steps.adacovex.outputs.spark_level }}
  test-count:
    description: 'Number of passing tests.'
    value: ${{ steps.adacovex.outputs.test_count }}
  coverage-pct:
    description: 'Current docstring coverage percentage (--coverage-delta mode).'
    value: ${{ steps.adacovex.outputs.coverage_pct }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Alire toolchain
      if: ${{ inputs.build == 'true' || inputs.prove == 'true' }}
      uses: alire-project/setup-alire@latest
      with:
        version: '2.1.1'
        # gnatprove is NOT an alr toolchain component; `alr toolchain` only
        # accepts compilers/build tools. It is resolved by the `prove`
        # subcommand via the target project's manifest (alire-dev.toml), the
        # README-preferred method, falling back to PATH / cached toolchain /
        # download. Only the compiler and gprbuild go in the toolchain here.
        toolchain: 'gnat_native=${{ inputs.gnat-version }} gprbuild'
        cache: ${{ inputs.cache }}

    - name: Restore adacovex result cache
      if: ${{ inputs.result-cache == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: ~/.adacovex/cache
        key: adacovex-result-${{ inputs.target }}-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          adacovex-result-${{ inputs.target }}-${{ runner.os }}-

    - name: Download adacovex release binary
      if: ${{ inputs.build == 'false' }}
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euxo pipefail
        VERSION="${INPUT_VERSION:-${ACTION_REF}}"
        VERSION="${VERSION#v}"
        if [ -z "$VERSION" ]; then
          echo "::error::build: false requires the 'version' input or a release-tag reference (e.g. @v1.3.0, @v1, or @latest)."
          exit 1
        fi
        # Resolve the 'latest' keyword to the newest published release.
        if [ "$VERSION" = "latest" ]; then
          echo "Resolving 'latest' to the newest published release..."
          VERSION=$(curl -fsSL "https://api.github.com/repos/${ACTION_REPO}/releases/latest" \
            | grep -oE '"tag_name": *"v[0-9]+\.[0-9]+\.[0-9]+"' \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -c2-)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve 'latest' release for ${ACTION_REPO}."
            exit 1
          fi
          echo "Resolved to v${VERSION}"
        fi
        # Resolve a floating ref (v1 or v1.3) to the latest matching release tag.
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Resolving floating ref v${VERSION} to latest matching release..."
          VERSION=$(curl -fsSL "https://api.github.com/repos/${ACTION_REPO}/releases" \
            | grep -oE '"tag_name": *"v[0-9]+\.[0-9]+\.[0-9]+"' \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -E "^v${VERSION}(\\.|$)" | head -1 | cut -c2-)
          if [ -z "$VERSION" ]; then
            echo "::error::No release found matching floating ref v${INPUT_VERSION:-${ACTION_REF}}."
            exit 1
          fi
          echo "Resolved to v${VERSION}"
        fi
        ASSET="adacovex-v${VERSION}.tar.gz"
        echo "Downloading $ASSET from ${ACTION_REPO} release v${VERSION}"
        mkdir -p "$GITHUB_WORKSPACE/bin"
        curl -fsSL "https://github.com/${ACTION_REPO}/releases/download/v${VERSION}/${ASSET}" \
          -o "$RUNNER_TEMP/${ASSET}"
        tar -xzf "$RUNNER_TEMP/${ASSET}" -C "$GITHUB_WORKSPACE/bin"
        chmod +x "$GITHUB_WORKSPACE/bin/adacovex"
        # Verify the downloaded binary is self-consistent and reports the
        # expected version (the release bundle embeds the tag it was built
        # from via ADACOVEX_VERSION).
        "$GITHUB_WORKSPACE/bin/adacovex" --version
        "$GITHUB_WORKSPACE/bin/adacovex" --help >/dev/null 2>&1 || true

    - name: Build adacovex
      if: ${{ inputs.build == 'true' }}
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        if [ -f adacovex.gpr ]; then
          # The checked-out repository IS adacovex (self-assessment via
          # `uses: ./`): build it in place.
          # Bundle the version from the release tag when building at a
          # vX.Y.Z tag ref; otherwise regenerate from alire-dev.toml so the
          # committed src/adacovex_version_info.ads is never stale.
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ADACOVEX_VERSION="${GITHUB_REF_NAME#v}" python3 tools/gen-version.py
          else
            python3 tools/gen-version.py
          fi
          if [ "${{ inputs.release-build }}" == 'true' ]; then
            alr build --release
          else
            alr build
          fi
        else
          # Consumer repository: the workspace is the target project, not
          # adacovex, so `alr build` here would build the consumer and never
          # produce a bin/adacovex.  Build adacovex from source at the
          # referenced ref in a scratch checkout instead.
          REF="${ACTION_REF:-v1}"
          if [ "$REF" = "." ] || [ -z "$REF" ]; then
            REF="v1"
          fi
          echo "Building adacovex from source at ${ACTION_REPO}@${REF}..."
          git clone --quiet "https://github.com/${ACTION_REPO}.git" "$RUNNER_TEMP/adacovex-src"
          cd "$RUNNER_TEMP/adacovex-src"
          if git rev-parse --verify --quiet "refs/tags/$REF" >/dev/null 2>&1; then
            git checkout --quiet "refs/tags/$REF"
          else
            git checkout --quiet "$REF" || git checkout --quiet "${REF#v}"
          fi
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ADACOVEX_VERSION="${GITHUB_REF_NAME#v}" python3 tools/gen-version.py
          else
            python3 tools/gen-version.py
          fi
          if [ "${{ inputs.release-build }}" == 'true' ]; then
            alr build --release
          else
            alr build
          fi
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cp bin/adacovex "$GITHUB_WORKSPACE/bin/adacovex"
          chmod +x "$GITHUB_WORKSPACE/bin/adacovex"
        fi

    - name: Build target native tests
      # run-tests promises to build AND run the target's native test suite.
      # In a consumer workspace the 'Build adacovex' step only builds
      # adacovex in a scratch checkout, so the target's test binary (e.g.
      # ./test_crdt or ./bin/test_runner) would be missing here.  Build the
      # target first so test-command actually has something to run; in the
      # self-assessment case (workspace IS adacovex) this is an incremental
      # no-op after 'Build adacovex' already ran alr build.
      if: ${{ inputs.run-tests == 'true' && inputs.build == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        alr build

    - name: Run native tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        ${{ inputs.test-command }}

    - name: Run GNATprove
      if: ${{ inputs.prove == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        PROVE_ARGS=()
        if [ -n "${{ inputs.prove-jobs }}" ]; then
          PROVE_ARGS+=(--jobs=${{ inputs.prove-jobs }})
        fi
        if [ -n "${{ inputs.prove-level }}" ]; then
          PROVE_ARGS+=(--level=${{ inputs.prove-level }})
        fi
        if [ -n "${{ inputs.prove-timeout }}" ]; then
          PROVE_ARGS+=(--timeout=${{ inputs.prove-timeout }})
        fi
        if [ -n "${{ inputs.prove-steps }}" ]; then
          PROVE_ARGS+=(--steps=${{ inputs.prove-steps }})
        fi
        if [ -n "${{ inputs.prove-memlimit }}" ]; then
          PROVE_ARGS+=(--memlimit=${{ inputs.prove-memlimit }})
        fi
        if [ "${{ inputs.prove-force }}" == 'true' ]; then
          PROVE_ARGS+=(--force)
        fi
        if [ "${{ inputs.prove-no-loop-unrolling }}" == 'true' ]; then
          PROVE_ARGS+=(--no-loop-unrolling)
        fi
        if [ "${{ inputs.prove-no-inlining }}" == 'true' ]; then
          PROVE_ARGS+=(--no-inlining)
        fi
        if [ -x bin/adacovex ]; then
          ./bin/adacovex prove --target="${{ inputs.target }}" "${PROVE_ARGS[@]}"
        elif command -v adacovex >/dev/null 2>&1; then
          adacovex prove --target="${{ inputs.target }}" "${PROVE_ARGS[@]}"
        elif command -v covex >/dev/null 2>&1; then
          covex prove --target="${{ inputs.target }}" "${PROVE_ARGS[@]}"
        else
          echo "::error::adacovex binary not found. Set build: true (builds adacovex from source) or install adacovex on PATH."
          exit 1
        fi

    - name: Run adacovex assessment
      if: ${{ inputs.assess == 'true' }}
      id: adacovex
      shell: bash
      run: |
        set -euxo pipefail
        cd "$GITHUB_WORKSPACE"
        # Deterministic SBOM timestamps: derive from the target git HEAD.
        if [ -d "${{ inputs.target }}/.git" ] || git rev-parse --git-dir >/dev/null 2>&1; then
          export SOURCE_DATE_EPOCH="$(git -C "${{ inputs.target }}" show -s --format=%ct HEAD 2>/dev/null || git show -s --format=%ct HEAD 2>/dev/null || echo 0)"
        fi
        BIN=""
        if [ -x bin/adacovex ]; then
          BIN="$GITHUB_WORKSPACE/bin/adacovex"
        elif command -v adacovex >/dev/null 2>&1; then
          BIN="$(command -v adacovex)"
        elif command -v covex >/dev/null 2>&1; then
          BIN="$(command -v covex)"
        fi
        if [ -z "$BIN" ]; then
          echo "::error::adacovex binary not found. Set build: true (builds adacovex from source) or install adacovex on PATH."
          exit 1
        fi
        ARGS=()
        ARGS+=(--target="${{ inputs.target }}")
        ARGS+=(--dal=${{ inputs.dal }})
        if [ -n "${{ inputs.standard }}" ]; then
          ARGS+=(--standard=${{ inputs.standard }})
        fi
        if [ -n "${{ inputs.asil }}" ]; then
          ARGS+=(--asil=${{ inputs.asil }})
        fi
        if [ -n "${{ inputs.class }}" ]; then
          ARGS+=(--class=${{ inputs.class }})
        fi
        if [ -n "${{ inputs.manifest }}" ]; then
          ARGS+=(--manifest="${{ inputs.manifest }}")
        fi
        if [ "${{ inputs.no-svg }}" == 'true' ]; then
          ARGS+=(--no-svg)
        fi
        if [ "${{ inputs.relaxed }}" == 'true' ]; then
          ARGS+=(--relaxed)
        fi
        if [ -n "${{ inputs.skip-dir }}" ]; then
          IFS=',' read -r -a SKIP_DIRS <<< "${{ inputs.skip-dir }}"
          for DIR in "${SKIP_DIRS[@]}"; do
            ARGS+=(--skip-dir="$DIR")
          done
        fi
        if [ "${{ inputs.verbose }}" == 'true' ]; then
          ARGS+=(--verbose)
        fi
        if [ "${{ inputs.no-cache }}" == 'true' ]; then
          ARGS+=(--no-cache)
        fi
        if [ -n "${{ inputs.cache-dir }}" ]; then
          ARGS+=(--cache-dir="${{ inputs.cache-dir }}")
        fi
        if [ -n "${{ inputs.cache-max }}" ]; then
          ARGS+=(--cache-max=${{ inputs.cache-max }})
        fi
        if [ -n "${{ inputs.compare-base }}" ]; then
          ARGS+=(--compare-base="${{ inputs.compare-base }}")
        fi
        if [ -n "${{ inputs.coverage-delta }}" ]; then
          ARGS+=(--coverage-delta="${{ inputs.coverage-delta }}")
        fi
        if [ -n "${{ inputs.emit-markdown }}" ]; then
          ARGS+=(--emit-markdown="${{ inputs.emit-markdown }}")
        fi
        if [ -n "${{ inputs.require-spark }}" ]; then
          ARGS+=(--require-spark="${{ inputs.require-spark }}")
        fi
        if [ -n "${{ inputs.require-docstrings }}" ]; then
          ARGS+=(--require-docstrings="${{ inputs.require-docstrings }}")
        fi
        if [ -n "${{ inputs.require-tests }}" ]; then
          ARGS+=(--require-tests="${{ inputs.require-tests }}")
        fi
        if [ -n "${{ inputs.require-proof }}" ]; then
          ARGS+=(--require-proof="${{ inputs.require-proof }}")
        fi
        if [ "${{ inputs.generate-sbom }}" == 'false' ]; then
          ARGS+=(--no-sbom)
        elif [ -z "${{ inputs.compare-base }}" ] && [ -z "${{ inputs.coverage-delta }}" ]; then
          ARGS+=(--sbom-format=${{ inputs.sbom-format }})
        fi
        set +e
        "$BIN" "${ARGS[@]}" > "$RUNNER_TEMP/adacovex.out" 2>&1
        STATUS=$?
        set -e
        cat "$RUNNER_TEMP/adacovex.out"

        #  Fail loudly: surface every unmet --require-* CI gate as an
        #  ::error:: annotation so a threshold failure is impossible to miss
        #  in the Actions UI (the exit code below also fails the step).
        if [ "$STATUS" -ne 0 ]; then
          while IFS= read -r GATE; do
            echo "::error::$GATE" >&2
          done < <(grep -oE 'CI GATE:.*' "$RUNNER_TEMP/adacovex.out" || true)
        fi

        BIN_VERSION="$("$BIN" --version 2>/dev/null | head -1 || true)"

        #  Compliance status: matches the standard-specific level label
        #  (DAL-A..E, ASIL A..D/QM, Class A..C) in both single-standard and
        #  --standard=all output.
        DAL_STATUS=$(grep -oE '(DAL-[A-E]|ASIL [A-D]|QM|Class [A-C]): (Achieved|Unmet)' "$RUNNER_TEMP/adacovex.out" | grep -oE '(Achieved|Unmet)' | head -1 || true)
        SPARK_LEVEL=$(grep -oE '(Stone|Bronze|Silver|Gold|Platinum)' "$RUNNER_TEMP/adacovex.out" | head -1 || true)
        TEST_COUNT=$(grep -oE '[0-9]+ passed' "$RUNNER_TEMP/adacovex.out" | grep -oE '[0-9]+' | head -1 || true)
        # Prefer the machine-parseable coverage_delta line (--coverage-delta mode);
        # otherwise fall back to the "docstrings:  N/ M ( P%)" line in normal mode.
        COVERAGE_PCT=$(grep -oE 'coverage_delta:.*current= *[0-9]+' "$RUNNER_TEMP/adacovex.out" | grep -oE '[0-9]+$' | head -1 || true)
        if [ -z "$COVERAGE_PCT" ]; then
          COVERAGE_PCT=$(grep -oE '\( *[0-9]+%\)' "$RUNNER_TEMP/adacovex.out" | grep -oE '[0-9]+' | head -1 || true)
        fi

        #  Human-readable compliance label mirroring the CLI precedence:
        #  --dal, then --standard, then --asil, then --class (last wins).
        COMPLIANCE_LABEL="DAL-${{ inputs.dal }}"
        if [ -n "${{ inputs.class }}" ]; then
          COMPLIANCE_LABEL="Class ${{ inputs.class }}"
        elif [ -n "${{ inputs.asil }}" ]; then
          COMPLIANCE_LABEL="ASIL ${{ inputs.asil }}"
        elif [ -n "${{ inputs.standard }}" ]; then
          case "${{ inputs.standard }}" in
            iso26262) COMPLIANCE_LABEL="ISO 26262 (DAL-${{ inputs.dal }})" ;;
            iec62304) COMPLIANCE_LABEL="IEC 62304 (DAL-${{ inputs.dal }})" ;;
            all)      COMPLIANCE_LABEL="All standards (tier DAL-${{ inputs.dal }})" ;;
          esac
        fi

        echo "dal_status=${DAL_STATUS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "spark_level=${SPARK_LEVEL:-unknown}" >> "$GITHUB_OUTPUT"
        echo "test_count=${TEST_COUNT:-0}" >> "$GITHUB_OUTPUT"
        echo "coverage_pct=${COVERAGE_PCT:-0}" >> "$GITHUB_OUTPUT"

        {
          echo '## adacovex assessment'
          echo ''
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| Target | \`${{ inputs.target }}\` |"
          echo "| adacovex | ${BIN_VERSION:-unknown} |"
          echo "| ${COMPLIANCE_LABEL} | ${DAL_STATUS:-unknown} |"
          echo "| SPARK level | ${SPARK_LEVEL:-unknown} |"
          echo "| Tests passed | ${TEST_COUNT:-0} |"
          echo "| Coverage | ${COVERAGE_PCT:-0}% |"
          echo ''
          if [ "$STATUS" -ne 0 ]; then
            echo "**FAILED: assessment exited with code $STATUS -- a DAL criterion or \`--require-*\` CI gate was not met.**"
            echo ''
            echo 'Unmet CI gates:'
            echo ''
            grep -oE 'CI GATE:.*' "$RUNNER_TEMP/adacovex.out" | sed 's/^/  - /' || true
            echo ''
          else
            echo '**PASSED: all DAL criteria and CI gates met.**'
            echo ''
          fi
          echo '```text'
          cat "$RUNNER_TEMP/adacovex.out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit $STATUS

    - name: Upload badges
      if: ${{ always() && inputs.assess == 'true' && inputs.compare-base == '' && inputs.coverage-delta == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: adacovex-badges
        path: ${{ inputs.target }}/docs/badges/*.svg
        if-no-files-found: ignore

    - name: Upload SBOM
      if: ${{ always() && inputs.assess == 'true' && inputs.generate-sbom == 'true' && inputs.compare-base == '' && inputs.coverage-delta == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: adacovex-sbom
        path: |
          ${{ inputs.target }}/sbom*.json
          ${{ inputs.target }}/docs/compliance/SBOM.md
        if-no-files-found: ignore

    - name: Save adacovex result cache
      if: ${{ always() && inputs.result-cache == 'true' && (inputs.assess == 'true' || inputs.prove == 'true') }}
      uses: actions/cache/save@v4
      with:
        path: ~/.adacovex/cache
        # Content-addressed entries mean a restored but slightly stale cache
        # is never wrong; the unique key keeps save/restore bounded per run.
        key: adacovex-result-${{ inputs.target }}-${{ runner.os }}-${{ github.run_id }}

    - name: Write run summary
      # Runs on success AND failure so every action invocation leaves a
      # Markdown summary at the bottom of the job page.
      if: ${{ always() }}
      shell: bash
      env:
        RUN_RESULT: ${{ job.status }}
      run: |
        set -uo pipefail
        VERSION_LINE="$("$GITHUB_WORKSPACE/bin/adacovex" --version 2>/dev/null | head -1 || true)"
        {
          echo '## adacovex run summary'
          echo ''
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | ${VERSION_LINE:-n/a} |"
          echo "| Target | \`${{ inputs.target }}\` |"
          echo "| Standard | ${{ inputs.standard }} |"
          echo "| DAL | ${{ inputs.dal }} |"
          echo "| Job result | $RUN_RESULT |"
          echo ''
          if [ "$RUN_RESULT" != "success" ]; then
            echo '**The adacovex action step failed.** Review the failing step'
            echo 'above; unmet --require-* CI gates are listed as ::error::'
            echo 'annotations and in the assessment summary table.'
          else
            echo 'The adacovex action completed successfully.'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
