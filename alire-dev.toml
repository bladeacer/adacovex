# Development manifest for local doc generation, formatting, and proof runs.
# Used exclusively by make doc/fmt/prove, which temporarily swap this manifest
# in for the duration of the command and then restore alire.toml (and
# alire.lock / alire/settings.toml) untouched. alire.toml is never polluted.
#
# gnatprove lives here (NOT in the publishing alire.toml), so the covex crate
# stays zero-dependency: make prove and adacovex's prove subcommand resolve it
# from the dev manifest via alr exec, while installing/building covex pulls no
# toolchain beyond the GNAT compiler. gnatdoc_bin and gnatformat_bin are also
# dev-only, required for make doc and make fmt, and MUST NOT appear in the
# published Alire community index.
name = "covex"
description = "Ada/SPARK coverage, proof, DO-178C compliance tool (dev)"
version = "1.8.0"
project-files = ["adacovex.gpr"]

authors = ["bladeacer"]
maintainers = ["bladeacer <wg.nick.exe@gmail.com>"]
maintainers-logins = ["bladeacer"]
licenses = "Apache-2.0"
website = "https://github.com/bladeacer/adacovex"
tags = ["ada", "spark", "formal-verify", "cli", "gnatprove", "sbom", "tests", "code-coverage", "do-178c", "compliance", "developer-tools"]

[[depends-on]]
gnatprove = "^15.1.0"
gnatdoc_bin = "^26.0.0"
gnatformat_bin = "^26.0.0"
